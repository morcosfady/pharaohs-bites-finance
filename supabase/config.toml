# Supabase CLI project config (used by `supabase db push`, `supabase functions deploy`).
# project_id is filled in by `supabase link`.
[api]
enabled = true
schemas = ["public", "storage"]

[db]
major_version = 15

[db.seed]
# Sample data is opt-in and dev-only. Leave disabled for production.
enabled = false
sql_paths = ["./seed.dev.sql"]

[auth]
enabled = true
site_url = "https://finance.pharaohsbites.com/"
additional_redirect_urls = ["https://finance.pharaohsbites.com", "https://finance.pharaohsbites.com/", "http://localhost:5173", "http://localhost:5173/"]
# Public signups are DISABLED. The first admin is created from the Supabase
# dashboard (see README) and then listed in admin_profiles.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[functions.create-order]
# The website calls this without a user session; the function applies its own
# origin allow-list, validation and rate limiting.
verify_jwt = false

[functions.create-checkout]
# Called by the website without a user session; applies its own origin allow-list.
verify_jwt = false

[functions.stripe-webhook]
# Called by Stripe; authenticated by the Stripe signature instead of a JWT.
verify_jwt = false

[functions.delivery-quote]
# Public read-only price quote for the order page; applies its own origin allow-list.
verify_jwt = false

# The Plaid functions authenticate themselves (admin JWT, or the cron secret for the
# daily sync), so the gateway must not demand a JWT: the scheduled run has none.
[functions.plaid-sync]
verify_jwt = false
[functions.plaid-link-token]
verify_jwt = false
[functions.plaid-exchange]
verify_jwt = false

[functions.mileage-place]
# Admin-only; checks the signed-in admin itself.
verify_jwt = false
